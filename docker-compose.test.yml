services:
  sqlserver-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Password123!", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-test:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:alpine
    ports:
      - "6379:6379"

  api-test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ConnectionStrings__DefaultConnection=Server=sqlserver-test;Database=TechGearAuction_Test;User Id=sa;Password=Password123!;TrustServerCertificate=True;
      - MinIO__Endpoint=minio-test:9000
      - MinIO__AccessKey=minioadmin
      - MinIO__SecretKey=minioadmin
      - Redis__Configuration=redis-test:6379
    ports:
      - "5000:8080"
    depends_on:
      sqlserver-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      redis-test:
        condition: service_started


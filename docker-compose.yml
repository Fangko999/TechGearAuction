version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: techgear_sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TechGear@2026!
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "TechGear@2026!", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: techgear_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: quay.io/minio/mc
    container_name: techgear_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/avatars || true;
      mc anonymous set download myminio/avatars;
      mc mb myminio/auctions || true;
      mc anonymous set download myminio/auctions;
      mc mb myminio/evidences || true;
      mc anonymous set download myminio/evidences;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techgear_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TechGearAuctionDb;User Id=sa;Password=TechGear@2026!;TrustServerCertificate=True;MultipleActiveResultSets=true
      - MinioSettings__Endpoint=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
    ports:
      - "8888:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_healthy


volumes:
  sql_data:
  minio_data: